[mgr]
show_hidden = true
show_symlink = true
sort_by = 'extension'
sort_dir_first = true
linemode = 'size'
ratio = [1, 3, 4]

[preview]
tab_size = 2
max_width = 600
max_height = 900



# for git
[[plugin.prepend_fetchers]]
id  = "git"
url = "*"
run = "git"

[[plugin.prepend_fetchers]]
id  = "git"
url = "*/"
run = "git"
